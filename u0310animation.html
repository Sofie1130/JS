<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="動畫">
   

    <title>Animation</title>
    <style>
        body{
                        margin: 0px;
        }

        @keyframes moveRight{
            0%  {transform:translate(0,0); }
            25% {transform:translateX(250px);}
            50% {transform:translate(250px,250px);}
            75% {transform:translate(0px,250px);}
            100%  {transform:translate(0,0); }
        }

         .aninmated{
            width: 50px;
            height: 50px;
            background-color: rgb(11, 161, 154);
            animation: moveRight 5s ease-in-out infinite;
        }
        div:nth-of-type(1) img{
            width: 100%;
        }

        div:nth-of-type(2) {
            position: fixed;
            top: 50px;
            left:50px;
        }
        
        div:nth-of-type(2) img{
            width: 200px;
            height: 200px;
        }

    </style>
    
</head>
<body>
     
    <div class="aninmated"><img src="images/icons/1.png"> </div>
    
    <div><img src="images/drink/1.jpg">   </div>
    
</body>
</html>
