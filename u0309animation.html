<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="動畫">
   

    <title>Animation</title>
    <style>

        @keyframes moveRight{
            0%  {transform:translateX(0); }
            50% {transform:translateX(500px);}
            100%  {transform:translateX(0); }
        }

         .aninmated{
            width: 50px;
            height: 50px;
            border: 15px rgb(211, 110, 16) solid;
            border-radius: 5px;
            background-color: rgb(2, 83, 79);
            animation: moveRight 3s ease-in-out infinite;
        }

    </style>
    
</head>
<body>
    <hr>
 <div class="aninmated"> </div>
<hr>
    
</body>
</html>
