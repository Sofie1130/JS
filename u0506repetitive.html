<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回圈</title>
</head>
<body>
<h1>存錢桶</h1>
<hr>
<p>第一天存1元，到第10天會存多少錢?</p>
<img src="images/pig.png" onclick="pig()">
<p id="result"></p>

<script>
    function pig(){
        let sum=0;
        r=document.querySelector('#result');
        r.innerHTML='';
for(let i=1;i<=10;i++){
r.innerHTML+=`第${i}天:${sum}+${i}=`;
sum+=i;
r.innerHTML +=sum+"<br>";

}
    }
</script>

    
</body>
</html>
