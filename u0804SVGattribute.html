<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <svg id="mysvg" width="500" height="500" xmls="http://www.w3.org/2000/svg">  </svg>
    <script>
        const svg=document.getElementById('mysvg');
        const circle=document.createElementNS('http://www.w3.org/2000/svg','cirlce');
       
        circle.setAttribute('cx','20');
        circle.setAttribute('cy','10');
        circle.setAttribute('r','20');
        circle.setAttribute('fill','crimson');
        circle.setAttribute('stroke','tomato');
        circle.setAttribute('stroke-width','10');

        svg.appendChild(circle);

        let x=50;
        function animate(){
            x +=2;
            circle.setAttribute('cx',x)
            if(x<450){
                requestAnimationFrame(animate);
            }
        }
animate();
    </script>

   
    
</body>
</html>
