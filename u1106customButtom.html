<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <custom-button></custom-button>

    <script>
        class MyButton extends HTMLElement{
            constructor(){
                super();
                const shadows=this.attachShadow({mode:'open'});
                shadows.innerHTML=`
            <style>
                button{
                    background-color: chocolate;
                    color: aqua;
                    border: none;
                    padding: 15px 25px;
                    cursor: pointer;
                    border-radius: 8px;
                }

                button:hover{
                    background-color: rgb(137, 238, 241);
                }
            </style>
            <button>預購從速</button>`;
    
            }
        }

    customElements.define('custom-button',MyButton);

    </script>

</body>
</html>
